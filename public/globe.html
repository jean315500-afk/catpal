<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>html,body{margin:0;height:100%;background:#fff;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}</style>
</head><body><canvas id="c"></canvas>
<script>
const Q = new URLSearchParams(location.search);
const MODE = Q.get('mode') || 'map';
const CITIES = { Seoul:[126.98,37.57], Tokyo:[139.69,35.68], Rome:[12.5,41.9], Taipei:[121.56,25.03], London:[-0.13,51.5], Bali:[115.19,-8.65], Paris:[2.35,48.86], Bangkok:[100.5,13.75], Sydney:[151.2,-33.87], 'New York':[-74,40.71], Vancouver:[-123.12,49.28], Singapore:[103.82,1.35] };
// A point is a city name above or "lon:lat" (CatPal sends country capitals); same token -> same array.
const PTS = {};
const pt = (s) => CITIES[s] || (/^-?\d+(\.\d+)?:-?\d+(\.\d+)?$/.test(s || '') ? (PTS[s] = PTS[s] || s.split(':').map(Number)) : null);
const HOME = pt(Q.get('from')) || CITIES.Seoul;
const DEST = pt(Q.get('to')) || CITIES.Rome;
const list = (k, d) => (Q.get(k) ?? d).split(',').map(pt).filter(Boolean);
const SENT = list('sent', 'Rome,Taipei,Tokyo,London');
const RECV = list('recv', 'Rome,Taipei,Tokyo,London');
const OCEAN = '#E2ECFB', LAND = '#6E9BE0', LAND_CORE = '#3F6FB5', INK = '63,111,181';
const NODES = [[-122,37],[-118,34],[-104,40],[-87,42],[-74,41],[-80,26],[-99,19],[-79,44],[-114,51],[-150,61],[-77,-12],[-47,-15],[-58,-34],[-70,-33],[-74,4],[-67,10],[-0.1,51],[2.3,49],[-3.7,40],[13,52],[12.5,42],[21,52],[30,50],[37.6,55.7],[18,59],[10.7,60],[28,41],[31,30],[3.4,6.5],[36.8,-1.3],[28,-26],[18.4,-34],[-17,14.7],[46.7,24.7],[55,25],[51,35.7],[67,25],[77,28.6],[72.8,19],[80,13],[90.4,23.8],[100.5,13.7],[106.8,-6.2],[103.8,1.3],[121,14.6],[114.2,22.3],[116.4,39.9],[121.5,31.2],[127,37.6],[139.7,35.7],[135.5,34.7],[104,30.6],[87.6,43.8],[82.9,55],[131.9,43.1],[151.2,-33.9],[145,-37.8],[115.9,-32],[153,-27.5],[174.8,-36.8],[133.9,-23.7],[-21.9,64.1],[-51.7,64.2],[47.5,-18.9],[44,33.3],[69.2,41.3],[106.9,47.9]];
const EDGES = [];
NODES.forEach((a, i) => { NODES.map((b, j) => [j, d3.geoDistance(a, b)]).filter(([j]) => j !== i).sort((x, y) => x[1] - y[1]).slice(0, 3).forEach(([j]) => { if (!EDGES.some(e => (e[0] === j && e[1] === i))) EDGES.push([i, j]); }); });

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const pin = new Image(); pin.src = './assets/icon-map-160.png';
let W, H, dpr, land, borders, countries = [];
const proj = MODE === 'mini' ? d3.geoNaturalEarth1().precision(.3) : d3.geoOrthographic().clipAngle(90).precision(.3);
const path = d3.geoPath(proj, ctx);
const grat = d3.geoGraticule().step([30, 20])();
const circle = d3.geoCircle();
function size() {
  dpr = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (MODE === 'mini') { if (typeof fitMini === 'function') fitMini(); }
  else if (MODE === 'hero') proj.scale(Math.min(W, H) * .46).translate([W / 2, H / 2]);
  else if (MODE === 'intro') proj.scale(Math.min(W * .54, H * .48)).translate([W / 2, H * .5]);
  else proj.scale(Math.min(W * .56, H * .3)).translate([W / 2, MODE === 'delivery' ? H * .4 : H * .44]);
}
const visible = (p) => d3.geoDistance(p, [-proj.rotate()[0], -proj.rotate()[1]]) < Math.PI / 2 - .02;
const easeOut = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);

// active regions: { p, start, feat }
const active = [];
function activate(p, start) {
  if (active.some(a => a.p === p)) return;
  active.push({ p, start, feat: null });
  matchFeatures();
}
function matchFeatures() { if (!countries.length) return; active.forEach(a => { if (!a.feat) a.feat = countries.find(f => d3.geoContains(f, a.p)) || null; }); }

const PAL = MODE === 'map' || MODE === 'intro'
  ? { sphere: '#C9E0FA', baseLand: '#DDEFD9', ocean: '#C9E0FA', land: '#8FCB8A', core: '#8FCB8A', line: '84,138,199', rim: .9, coast: .95, border: .55, link: .35, haloLand: true }
  : { sphere: '#fff', baseLand: null, ocean: OCEAN, land: LAND, core: LAND_CORE, line: INK, rim: .45, coast: .95, border: .3, link: .28, haloLand: false };
function base(now) {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.beginPath(); path({ type: 'Sphere' }); ctx.fillStyle = PAL.sphere; ctx.fill();
  ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(' + PAL.line + ',' + PAL.rim + ')'; ctx.stroke();
  if (land && PAL.baseLand) { ctx.beginPath(); path(land); ctx.fillStyle = PAL.baseLand; ctx.fill(); }
  active.forEach(a => {
    const k = easeOut((now - a.start) / 1800);
    if (k <= 0) return;
    const breathe = 1 + Math.sin((now - a.start) / 900) * .04;
    (PAL.haloLand ? [[1.6, .14], [1.25, .28], [1, .5]] : [[1.6, .2], [1.25, .42], [1, 1]]).forEach(([m, alpha]) => {
      const r = Math.max(.1, 15 * k * m * breathe);
      ctx.save(); ctx.beginPath(); path(circle.center(a.p).radius(r)()); ctx.clip();
      ctx.globalAlpha = alpha;
      if (!PAL.haloLand) { ctx.beginPath(); path({ type: 'Sphere' }); ctx.fillStyle = PAL.ocean; ctx.fill(); }
      if (land) { ctx.beginPath(); path(land); ctx.fillStyle = PAL.land; ctx.fill(); }
      ctx.restore();
    });
    if (a.feat) { ctx.globalAlpha = k; ctx.beginPath(); path(a.feat); ctx.fillStyle = PAL.core; ctx.fill(); }
    ctx.globalAlpha = 1;
  });
  ctx.beginPath(); path(LINKS); ctx.lineWidth = .6; ctx.strokeStyle = 'rgba(' + PAL.line + ',' + PAL.link + ')'; ctx.stroke();
  if (land) {
    ctx.beginPath(); path(borders); ctx.lineWidth = .5; ctx.strokeStyle = 'rgba(' + PAL.line + ',' + PAL.border + ')'; ctx.stroke();
    ctx.beginPath(); path(land); ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(' + PAL.line + ',' + PAL.coast + ')'; ctx.stroke();
  }

}
function dot(p, color, r) {
  if (!visible(p)) return; const [x, y] = proj(p);
  ctx.beginPath(); ctx.arc(x, y, r + 2.5, 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = color; ctx.fill();
}
function catPin(p, s) {
  if (!visible(p) || !pin.complete || s <= 0) return; const [x, y] = proj(p);
  ctx.drawImage(pin, x - s / 2, y - s * .97, s, s);
}
function arc(a, b, t, dashed) {
  const ip = d3.geoInterpolate(a, b), pts = [];
  for (let i = 0; i <= 64 * t; i++) pts.push(ip(i / 64));
  if (t < 1) pts.push(ip(t));
  ctx.beginPath(); path({ type: 'LineString', coordinates: pts });
  ctx.setLineDash(dashed ? [5, 6] : []); ctx.lineWidth = 2; ctx.strokeStyle = '#FF4B3E'; ctx.stroke(); ctx.setLineDash([]);
  return ip(t);
}
function postcard(p) {
  if (!visible(p)) return; const [x, y] = proj(p);
  ctx.save(); ctx.translate(x, y); ctx.rotate(-.15);
  ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 8; ctx.fillStyle = '#F9F4EB'; ctx.fillRect(-15, -10, 30, 20);
  ctx.shadowBlur = 0; ctx.fillStyle = '#FF4B3E'; ctx.fillRect(5, -7, 7, 8);
  ctx.fillStyle = '#D9D9D9'; ctx.fillRect(-11, 1, 12, 1.5); ctx.fillRect(-11, 5, 16, 1.5); ctx.restore();
}
const ease = d3.easeCubicInOut;
let rot = [-120, -25], dragging = false;
const t0 = performance.now();
if (MODE === 'delivery') {
  const mid = d3.geoInterpolate(HOME, DEST)(.5);
  const rI = d3.interpolate([-HOME[0], -HOME[1] * .6], [-mid[0], -mid[1] * .6]);
  activate(HOME, t0);
  (function frame(now) {
    const e = (now - t0) / 1000;
    const FL = 6.6;
    const tt = Math.max(0, Math.min(1, (e - .2) / FL));
    if (tt >= 1) activate(DEST, t0 + (.2 + FL) * 1000);
    proj.rotate(rI(ease(Math.min(1, e / (FL * .85))))); base(now);
    dot(HOME, '#FF4B3E', 4);
    const head = arc(HOME, DEST, ease(tt), true);
    if (tt < 1) postcard(head);
    else { const k = Math.min(1, (e - .2 - FL) / .35); catPin(DEST, 34 * (k < .7 ? k / .7 * 1.15 : 1.15 - (k - .7) / .3 * .15)); }
    requestAnimationFrame(frame);
  })(t0);
} else if (MODE === 'mini') {
  // Home "letters around the world": a small flat map with your CatPals' countries,
  // dotted routes and envelopes going back and forth (country level only).
  var MINI_BG = '#' + (Q.get('bg') || 'F4F2EE');
  document.body.style.background = MINI_BG;
  var M_HOME = pt(Q.get('from'));
  var M_PALS = (Q.get('pals') || '').split(',').filter(Boolean).map(t => { const [x, y, d] = t.split(':'); return { p: pt(x + ':' + y), d: d || 'b' }; }).filter(o => o.p);
  var fitMini = function () {
    const pts = [M_HOME, ...M_PALS.map(o => o.p)].filter(Boolean);
    const c = pts.length ? d3.geoCentroid({ type: 'MultiPoint', coordinates: pts }) : [20, 20];
    proj.rotate([-c[0], 0]).center([0, 0]).translate([W / 2, H / 2]);
    proj.fitSize([W, H], { type: 'Sphere' }); const sWorld = proj.scale();
    let s = sWorld * 3.2;
    if (pts.length > 1) { proj.fitExtent([[44, 44], [W - 44, H - 22]], { type: 'MultiPoint', coordinates: pts }); s = Math.min(proj.scale(), sWorld * 3.2); }
    const lats = pts.map(p => p[1]), latMid = pts.length ? (Math.max(...lats) + Math.min(...lats)) / 2 : c[1];  // centre on the points' span, not the spherical centroid
    proj.rotate([-c[0], 0]).center([0, latMid]).scale(Math.max(s, sWorld)).translate([W / 2, H / 2 + 8]);
  };
  const env = (x, y, ang) => { ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.shadowColor = 'rgba(90,70,40,.25)'; ctx.shadowBlur = 5; ctx.fillStyle = '#FFFDF9'; ctx.fillRect(-9, -6, 18, 12); ctx.shadowBlur = 0; ctx.strokeStyle = '#C9785D'; ctx.lineWidth = 1; ctx.strokeRect(-9, -6, 18, 12); ctx.beginPath(); ctx.moveTo(-9, -6); ctx.lineTo(0, 1.2); ctx.lineTo(9, -6); ctx.stroke(); ctx.restore(); };
  // reduced motion: a still frame with the envelopes mid-flight
  const STILL = matchMedia('(prefers-reduced-motion: reduce)').matches;
  (function frame(now) {
    const e = STILL ? 2.1 : (now - t0) / 1000;
    ctx.clearRect(0, 0, W, H); ctx.fillStyle = '#E8EFF3'; ctx.fillRect(0, 0, W, H);
    ctx.beginPath(); path(grat); ctx.lineWidth = .5; ctx.strokeStyle = 'rgba(125,155,181,.18)'; ctx.stroke();
    if (land) { ctx.beginPath(); path(land); ctx.fillStyle = '#DCE6D4'; ctx.fill(); ctx.lineWidth = .7; ctx.strokeStyle = 'rgba(140,165,130,.7)'; ctx.stroke();
      ctx.beginPath(); path(borders); ctx.lineWidth = .4; ctx.strokeStyle = 'rgba(140,165,130,.45)'; ctx.stroke(); }
    if (M_HOME) M_PALS.forEach((o, i) => {
      const ip = d3.geoInterpolate(M_HOME, o.p), pts = []; for (let k = 0; k <= 48; k++) pts.push(ip(k / 48));
      ctx.beginPath(); path({ type: 'LineString', coordinates: pts }); ctx.setLineDash([2, 5]); ctx.lineCap = 'round'; ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(201,120,93,.85)'; ctx.stroke(); ctx.setLineDash([]);
      // envelope: out (sent), back (received) or both, staggered per route
      const T = 4.2, k = ((e + i * 1.3) % (T * 2)) / T, out = k < 1;
      const dirOk = o.d === 'b' || (o.d === 's' && out) || (o.d === 'r' && !out);
      if (!dirOk) return;
      const u = d3.easeCubicInOut(out ? k : k - 1), at = out ? ip(u) : ip(1 - u), nx = out ? ip(Math.min(1, u + .02)) : ip(Math.max(0, 1 - u - .02));
      const a1 = proj(at), a2 = proj(nx); if (!a1 || !a2) return;
      env(a1[0], a1[1], Math.max(-.6, Math.min(.6, Math.atan2(a2[1] - a1[1], a2[0] - a1[0]))));
    });
    M_PALS.forEach(o => { const q = proj(o.p); if (!q || !pin.complete) return; ctx.drawImage(pin, q[0] - 13, q[1] - 25, 26, 26); });
    if (M_HOME) { const q = proj(M_HOME); if (q) { ctx.beginPath(); ctx.arc(q[0], q[1], 7, 0, 7); ctx.fillStyle = 'rgba(93,134,181,.22)'; ctx.fill(); ctx.beginPath(); ctx.arc(q[0], q[1], 4, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.beginPath(); ctx.arc(q[0], q[1], 3, 0, 7); ctx.fillStyle = '#5D86B5'; ctx.fill(); } }
    requestAnimationFrame(frame);
  })(t0);
} else if (MODE === 'hero') {
  // Home hero: a quiet globe in the page's colours and one small envelope drifting along a
  // dotted path from the sender's country to yours (country level only; no pins, no tracking).
  const BG = '#' + (Q.get('bg') || 'F7F2EA');
  document.body.style.background = BG;
  const A = pt(Q.get('from')), B = pt(Q.get('to'));
  const route = A && B && d3.geoDistance(A, B) > .02;
  const c = route ? d3.geoInterpolate(A, B)(.5) : (B || A || [127, 37]);
  const r0 = [-c[0], -c[1] * .6];
  const sea = '#EAF0F2', landC = '#D8E2D2', lineC = 'rgba(125,155,181,', dot2 = (p, col, r) => { if (!visible(p)) return; const [x, y] = proj(p); ctx.beginPath(); ctx.arc(x, y, r + 2, 0, 7); ctx.fillStyle = BG; ctx.fill(); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = col; ctx.fill(); };
  function envelope(p, ang) {
    if (!visible(p)) return; const [x, y] = proj(p);
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.shadowColor = 'rgba(90,70,40,.25)'; ctx.shadowBlur = 6; ctx.fillStyle = '#FFFDF9'; ctx.fillRect(-11, -7.5, 22, 15);
    ctx.shadowBlur = 0; ctx.strokeStyle = '#C9785D'; ctx.lineWidth = 1.1; ctx.strokeRect(-11, -7.5, 22, 15);
    ctx.beginPath(); ctx.moveTo(-11, -7.5); ctx.lineTo(0, 1.5); ctx.lineTo(11, -7.5); ctx.stroke(); ctx.restore();
  }
  (function frame(now) {
    const e = (now - t0) / 1000;
    proj.rotate([r0[0] + Math.sin(e / 7) * 6, r0[1]]);
    ctx.clearRect(0, 0, W, H); ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
    ctx.beginPath(); path({ type: 'Sphere' }); ctx.fillStyle = sea; ctx.fill();
    ctx.beginPath(); path(grat); ctx.lineWidth = .5; ctx.strokeStyle = lineC + '.22)'; ctx.stroke();
    if (land) { ctx.beginPath(); path(land); ctx.fillStyle = landC; ctx.fill(); ctx.lineWidth = .6; ctx.strokeStyle = 'rgba(140,165,130,.6)'; ctx.stroke(); }
    ctx.beginPath(); path({ type: 'Sphere' }); ctx.lineWidth = 1; ctx.strokeStyle = lineC + '.45)'; ctx.stroke();
    if (route) {
      const ip = d3.geoInterpolate(A, B), pts = []; for (let i = 0; i <= 64; i++) pts.push(ip(i / 64));
      ctx.beginPath(); path({ type: 'LineString', coordinates: pts }); ctx.setLineDash([2, 5]); ctx.lineCap = 'round'; ctx.lineWidth = 1.6; ctx.strokeStyle = 'rgba(201,120,93,.85)'; ctx.stroke(); ctx.setLineDash([]);
      dot2(A, '#7D9BB5', 3.5); dot2(B, '#C9785D', 3.5);
      const k = (e % 6.5) / 5, tt = ease(Math.min(1, k));
      const p = ip(tt), q = ip(Math.min(1, tt + .01)), [x1, y1] = proj(p), [x2, y2] = proj(q);
      envelope(p, Math.max(-.6, Math.min(.6, Math.atan2(y2 - y1, x2 - x1))));

    requestAnimationFrame(frame);

} else if (MODE === 'intro') {

  const DESTS = list('to', 'London,Paris,Tokyo,Taipei');
  const c = d3.geoCentroid({ type: 'MultiPoint', coordinates: [HOME, ...DESTS] });
  const r0 = [-c[0], -c[1] * .55];
  const GAP = .9, OUT = 1.4, STAY = .6, BACK = 1.4, T = DESTS.length * GAP + OUT + STAY + BACK + .6;
  const arrived = DESTS.map(() => null);
  activate(HOME, t0);
  (function frame(now) {
    const e = (now - t0) / 1000;
    proj.rotate([r0[0] + Math.sin(e / 5) * 5, r0[1]]); base(now);
    const moving = [];
    DESTS.forEach((d, i) => {
      const s = e - .4 - i * GAP;
      if (s < 0) return;
      const k = s % T;
      if (arrived[i] === null && s >= OUT) { arrived[i] = now; activate(d, now); }
      if (arrived[i] === null) { moving.push(arc(HOME, d, ease(k / OUT), true)); return; }
      arc(HOME, d, 1, true);
      if (k < OUT) moving.push(d3.geoInterpolate(HOME, d)(ease(k / OUT)));
      else if (k >= OUT + STAY && k < OUT + STAY + BACK) moving.push(d3.geoInterpolate(d, HOME)(ease((k - OUT - STAY) / BACK)));
    });

    DESTS.forEach((d, i) => { if (arrived[i] === null) return; const q = Math.min(1, (now - arrived[i]) / 450); catPin(d, 28 * (q < .7 ? q / .7 * 1.15 : 1.15 - (q - .7) / .3 * .15)); });

    requestAnimationFrame(frame);

  proj.rotate(rot);

  pts.forEach((p, i) => activate(p, t0 + 300 + i * 420));

    .on('start', () => dragging = true)
    .on('drag', (ev) => { const k = 75 / proj.scale(); rot = [rot[0] + ev.dx * k, Math.max(-60, Math.min(60, rot[1] - ev.dy * k))]; })
    .on('end', () => dragging = false));
  const NAMES = Object.keys(CITIES);
  const hitList = () => [...(HOME === CITIES.Seoul ? [['Seoul', HOME]] : []), ...NAMES.filter(n => n !== 'Seoul' && (SENT.includes(CITIES[n]) || RECV.includes(CITIES[n]))).map(n => [n, CITIES[n]])];

    const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
    let best = null, bd = 22;
    hitList().forEach(([n, p]) => { if (!visible(p)) return; const [px, py] = proj(p); for (const oy of [0, -12]) { const d = Math.hypot(px - x, py + oy - y); if (d < bd) { bd = d; best = n; } } });
    return best;
  };

    if (!dragging) rot[0] += .06;
    proj.rotate(rot); base(now);

    SENT.forEach(p => dot(p, '#FF4B3E', 3.5));
    RECV.forEach((p) => { const a = active.find(x => x.p === p); catPin(p, a ? 26 * easeOut((now - a.start - 600) / 500) : 26); });

}
size(); addEventListener('resize', size);
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(r => r.json()).then(topo => {
  land = topojson.merge(topo, topo.objects.countries.geometries);
  borders = topojson.mesh(topo, topo.objects.countries, (a, b) => a !== b);
  countries = topojson.feature(topo, topo.objects.countries).features;
  matchFeatures();
});
</script>
</body></html>
