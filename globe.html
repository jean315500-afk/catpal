<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>html,body{margin:0;height:100%;background:#fff;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}</style>
</head><body><canvas id="c"></canvas>
<script>
const Q = new URLSearchParams(location.search);
const MODE = Q.get('mode') || 'map';
const CITIES = { Seoul:[126.98,37.57], Tokyo:[139.69,35.68], Rome:[12.5,41.9], Taipei:[121.56,25.03], London:[-0.13,51.5], Bali:[115.19,-8.65], Paris:[2.35,48.86], Bangkok:[100.5,13.75], Sydney:[151.2,-33.87], 'New York':[-74,40.71], Vancouver:[-123.12,49.28], Singapore:[103.82,1.35] };
const HOME = CITIES.Seoul;
const DEST = CITIES[Q.get('to')] || CITIES.Rome;
const list = (k, d) => (Q.get(k) ?? d).split(',').map(s => CITIES[s]).filter(Boolean);
const SENT = list('sent', 'Rome,Taipei,Tokyo,London');
const RECV = list('recv', 'Rome,Taipei,Tokyo,London');
const OCEAN = '#E2ECFB', LAND = '#6E9BE0', LAND_CORE = '#3F6FB5', INK = '63,111,181';
const NODES = [[-122,37],[-118,34],[-104,40],[-87,42],[-74,41],[-80,26],[-99,19],[-79,44],[-114,51],[-150,61],[-77,-12],[-47,-15],[-58,-34],[-70,-33],[-74,4],[-67,10],[-0.1,51],[2.3,49],[-3.7,40],[13,52],[12.5,42],[21,52],[30,50],[37.6,55.7],[18,59],[10.7,60],[28,41],[31,30],[3.4,6.5],[36.8,-1.3],[28,-26],[18.4,-34],[-17,14.7],[46.7,24.7],[55,25],[51,35.7],[67,25],[77,28.6],[72.8,19],[80,13],[90.4,23.8],[100.5,13.7],[106.8,-6.2],[103.8,1.3],[121,14.6],[114.2,22.3],[116.4,39.9],[121.5,31.2],[127,37.6],[139.7,35.7],[135.5,34.7],[104,30.6],[87.6,43.8],[82.9,55],[131.9,43.1],[151.2,-33.9],[145,-37.8],[115.9,-32],[153,-27.5],[174.8,-36.8],[133.9,-23.7],[-21.9,64.1],[-51.7,64.2],[47.5,-18.9],[44,33.3],[69.2,41.3],[106.9,47.9]];
const EDGES = [];
NODES.forEach((a, i) => { NODES.map((b, j) => [j, d3.geoDistance(a, b)]).filter(([j]) => j !== i).sort((x, y) => x[1] - y[1]).slice(0, 3).forEach(([j]) => { if (!EDGES.some(e => (e[0] === j && e[1] === i))) EDGES.push([i, j]); }); });
const LINKS = { type: 'MultiLineString', coordinates: EDGES.map(([i, j]) => [NODES[i], NODES[j]]) };
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const pin = new Image(); pin.src = './assets/icon-map-160.png';
let W, H, dpr, land, borders, countries = [];
const proj = d3.geoOrthographic().clipAngle(90).precision(.3);
const path = d3.geoPath(proj, ctx);
const grat = d3.geoGraticule().step([30, 20])();
const circle = d3.geoCircle();
function size() {
  dpr = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  proj.scale(Math.min(W * .56, H * .3)).translate([W / 2, MODE === 'delivery' ? H * .4 : H * .44]);
}
const visible = (p) => d3.geoDistance(p, [-proj.rotate()[0], -proj.rotate()[1]]) < Math.PI / 2 - .02;
const easeOut = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);

// active regions: { p, start, feat }
const active = [];
function activate(p, start) {
  if (active.some(a => a.p === p)) return;
  active.push({ p, start, feat: null });
  matchFeatures();
}
function matchFeatures() { if (!countries.length) return; active.forEach(a => { if (!a.feat) a.feat = countries.find(f => d3.geoContains(f, a.p)) || null; }); }

const PAL = MODE === 'map'
  ? { sphere: '#C9E0FA', baseLand: '#DDEFD9', ocean: '#C9E0FA', land: '#8FCB8A', core: '#8FCB8A', line: '84,138,199', rim: .9, coast: .95, border: .55, link: .35, haloLand: true }
  : { sphere: '#fff', baseLand: null, ocean: OCEAN, land: LAND, core: LAND_CORE, line: INK, rim: .45, coast: .95, border: .3, link: .28, haloLand: false };
function base(now) {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.beginPath(); path({ type: 'Sphere' }); ctx.fillStyle = PAL.sphere; ctx.fill();
  ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(' + PAL.line + ',' + PAL.rim + ')'; ctx.stroke();
  if (land && PAL.baseLand) { ctx.beginPath(); path(land); ctx.fillStyle = PAL.baseLand; ctx.fill(); }
  active.forEach(a => {
    const k = easeOut((now - a.start) / 1800);
    if (k <= 0) return;
    const breathe = 1 + Math.sin((now - a.start) / 900) * .04;
    (PAL.haloLand ? [[1.6, .14], [1.25, .28], [1, .5]] : [[1.6, .2], [1.25, .42], [1, 1]]).forEach(([m, alpha]) => {
      const r = Math.max(.1, 15 * k * m * breathe);
      ctx.save(); ctx.beginPath(); path(circle.center(a.p).radius(r)()); ctx.clip();
      ctx.globalAlpha = alpha;
      if (!PAL.haloLand) { ctx.beginPath(); path({ type: 'Sphere' }); ctx.fillStyle = PAL.ocean; ctx.fill(); }
      if (land) { ctx.beginPath(); path(land); ctx.fillStyle = PAL.land; ctx.fill(); }
      ctx.restore();
    });
    if (a.feat) { ctx.globalAlpha = k; ctx.beginPath(); path(a.feat); ctx.fillStyle = PAL.core; ctx.fill(); }
    ctx.globalAlpha = 1;
  });
  ctx.beginPath(); path(LINKS); ctx.lineWidth = .6; ctx.strokeStyle = 'rgba(' + PAL.line + ',' + PAL.link + ')'; ctx.stroke();
  if (land) {
    ctx.beginPath(); path(borders); ctx.lineWidth = .5; ctx.strokeStyle = 'rgba(' + PAL.line + ',' + PAL.border + ')'; ctx.stroke();
    ctx.beginPath(); path(land); ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(' + PAL.line + ',' + PAL.coast + ')'; ctx.stroke();
  }
  NODES.forEach(p => { if (!visible(p)) return; const [x, y] = proj(p); ctx.beginPath(); ctx.arc(x, y, 1.9, 0, 7); ctx.fillStyle = 'rgb(' + PAL.line + ')'; ctx.fill(); });
}
function dot(p, color, r) {
  if (!visible(p)) return; const [x, y] = proj(p);
  ctx.beginPath(); ctx.arc(x, y, r + 2.5, 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = color; ctx.fill();
}
function catPin(p, s) {
  if (!visible(p) || !pin.complete || s <= 0) return; const [x, y] = proj(p);
  ctx.drawImage(pin, x - s / 2, y - s * .97, s, s);
}
function arc(a, b, t, dashed) {
  const ip = d3.geoInterpolate(a, b), pts = [];
  for (let i = 0; i <= 64 * t; i++) pts.push(ip(i / 64));
  if (t < 1) pts.push(ip(t));
  ctx.beginPath(); path({ type: 'LineString', coordinates: pts });
  ctx.setLineDash(dashed ? [5, 6] : []); ctx.lineWidth = 2; ctx.strokeStyle = '#FF4B3E'; ctx.stroke(); ctx.setLineDash([]);
  return ip(t);
}
function postcard(p) {
  if (!visible(p)) return; const [x, y] = proj(p);
  ctx.save(); ctx.translate(x, y); ctx.rotate(-.15);
  ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 8; ctx.fillStyle = '#F9F4EB'; ctx.fillRect(-15, -10, 30, 20);
  ctx.shadowBlur = 0; ctx.fillStyle = '#FF4B3E'; ctx.fillRect(5, -7, 7, 8);
  ctx.fillStyle = '#D9D9D9'; ctx.fillRect(-11, 1, 12, 1.5); ctx.fillRect(-11, 5, 16, 1.5); ctx.restore();
}
const ease = d3.easeCubicInOut;
let rot = [-120, -25], dragging = false;
const t0 = performance.now();
if (MODE === 'delivery') {
  const mid = d3.geoInterpolate(HOME, DEST)(.5);
  const rI = d3.interpolate([-HOME[0], -HOME[1] * .6], [-mid[0], -mid[1] * .6]);
  activate(HOME, t0);
  (function frame(now) {
    const e = (now - t0) / 1000;
    const FL = 6.6;
    const tt = Math.max(0, Math.min(1, (e - .2) / FL));
    if (tt >= 1) activate(DEST, t0 + (.2 + FL) * 1000);
    proj.rotate(rI(ease(Math.min(1, e / (FL * .85))))); base(now);
    dot(HOME, '#FF4B3E', 4);
    const head = arc(HOME, DEST, ease(tt), true);
    if (tt < 1) postcard(head);
    else { const k = Math.min(1, (e - .2 - FL) / .35); catPin(DEST, 34 * (k < .7 ? k / .7 * 1.15 : 1.15 - (k - .7) / .3 * .15)); }
    requestAnimationFrame(frame);
  })(t0);
} else {
  proj.rotate(rot);
  const pts = [HOME, ...new Set([...SENT, ...RECV])];
  pts.forEach((p, i) => activate(p, t0 + 300 + i * 420));
  d3.select(cv).call(d3.drag()
    .on('start', () => dragging = true)
    .on('drag', (ev) => { const k = 75 / proj.scale(); rot = [rot[0] + ev.dx * k, Math.max(-60, Math.min(60, rot[1] - ev.dy * k))]; })
    .on('end', () => dragging = false));
  const NAMES = Object.keys(CITIES);
  const hitList = () => [['Seoul', HOME], ...NAMES.filter(n => n !== 'Seoul' && (SENT.includes(CITIES[n]) || RECV.includes(CITIES[n]))).map(n => [n, CITIES[n]])];
  const hit = (ev) => {
    const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
    let best = null, bd = 22;
    hitList().forEach(([n, p]) => { if (!visible(p)) return; const [px, py] = proj(p); for (const oy of [0, -12]) { const d = Math.hypot(px - x, py + oy - y); if (d < bd) { bd = d; best = n; } } });
    return best;
  };
  cv.addEventListener('mousemove', (ev) => { cv.style.cursor = hit(ev) ? 'pointer' : 'grab'; });
  cv.addEventListener('click', (ev) => { const n = hit(ev); if (n) window.parent.postMessage({ type: 'catpal-city', city: n }, '*'); });
  (function frame(now) {
    if (!dragging) rot[0] += .06;
    proj.rotate(rot); base(now);
    SENT.forEach(p => arc(HOME, p, 1, true));
    dot(HOME, '#FF4B3E', 4.5);
    SENT.forEach(p => dot(p, '#FF4B3E', 3.5));
    RECV.forEach((p) => { const a = active.find(x => x.p === p); catPin(p, a ? 26 * easeOut((now - a.start - 600) / 500) : 26); });
    requestAnimationFrame(frame);
  })(t0);
}
size(); addEventListener('resize', size);
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(r => r.json()).then(topo => {
  land = topojson.merge(topo, topo.objects.countries.geometries);
  borders = topojson.mesh(topo, topo.objects.countries, (a, b) => a !== b);
  countries = topojson.feature(topo, topo.objects.countries).features;
  matchFeatures();
});
</script>
</body></html>
